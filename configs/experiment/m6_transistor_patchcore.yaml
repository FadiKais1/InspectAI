# Milestone 6 experiment contract.
# Locked before official test evaluation. Do not retune on test AUROC.

name: m6_transistor_patchcore
category: transistor

hypothesis: >
  A multi-scale PatchCore-style representation using intermediate frozen
  CNN features and a representative coreset memory will preserve local
  detail better than the single-layer random-memory patch-kNN baseline,
  potentially improving pixel-level localization while maintaining strong
  image-level anomaly detection.

comparison: >
  M4: ResNet18 layer3 only + random memory (50k).
  M6: ResNet18 layer2+layer3 aligned concat + greedy coreset (10k).

backbone: resnet18
imagenet_weights: IMAGENET1K_V1
frozen: true
feature_layers:
  - layer2
  - layer3
input_size: 512
k_neighbors: 1
max_memory_patches: 10000
candidate_pool_size: 50000
seed: 42
image_score: spatial_max
coreset: deterministic_presample_then_greedy_farthest_point
coreset_note: >
  Pre-evaluation computational amendment (before any official test metrics):
  greedy FPS on all ~872k layer2 patches at 512 was infeasible on local CPU.
  Deterministically pre-sample at most 50,000 candidates (seed 42), then run
  the same projected greedy farthest-point selection to 10,000 memory vectors.
projection_dim: 128
projection: gaussian
interpolation: bilinear
