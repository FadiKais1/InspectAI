[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inspectai"
version = "0.1.0"
description = "Industrial visual anomaly detection and quality inspection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fadi Kais" }]
dependencies = [
    "pandas",
    "numpy",
    "Pillow",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
torch = ["torch", "torchvision"]
dinov3 = ["torch", "torchvision", "transformers"]
demo = ["streamlit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src", "tests", "app"]

[tool.ruff.lint.per-file-ignores]
"app/streamlit_app.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that require local MVTec data under data/raw/",
]
